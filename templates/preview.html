<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>واعي | waei</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---------- Tokens ---------- */
      :root {
        /* Brand colors taken from the logo */
        --navy: #021122;
        --navy-2: #0b2440;
        --gold: #d2b98a;
        --gold-deep: #a8854a;
        --teal: #31917f;

        /* Light theme */
        --primary: #0e2a47;
        --primary-700: #021122;
        --primary-900: #021122;
        --primary-50: #edf0f4;
        --on-primary: #ffffff;
        --accent: #a8854a;
        --accent-soft: #f6efe2;

        --bg: #f3f4f6;
        --card: #ffffff;
        --card-2: #f8f9fb;
        --input: #f8f9fb;
        --border: #e0e4ea;
        --border-strong: #c7cfd9;
        --text: #0b1a2b;
        --muted: #5e6b7a;

        --ok: #227a68;
        --ok-bg: #e3f3ef;
        --bad: #c0392b;
        --bad-bg: #fbeae8;
        --warn: #9a6512;
        --warn-bg: #fbf1de;
        --na: #697383;
        --na-bg: #eff1f4;

        --notice-bg: #fbf5ea;
        --notice-border: #ead9b8;
        --notice-text: #6e5528;

        --radius: 16px;
        --shadow:
          0 1px 2px rgba(2, 17, 34, 0.05), 0 4px 14px rgba(2, 17, 34, 0.06);
        color-scheme: light;
      }

      /* Dark theme — matches the logo's navy and gold */
      [data-theme="dark"] {
        --primary: #d2b98a;
        --primary-700: #e3cfa6;
        --primary-900: #021122;
        --primary-50: rgba(210, 185, 138, 0.12);
        --on-primary: #021122;
        --accent: #d2b98a;
        --accent-soft: rgba(210, 185, 138, 0.1);

        --bg: #021122;
        --card: #0a1d32;
        --card-2: #0e2540;
        --input: #071829;
        --border: #1a3150;
        --border-strong: #2a4568;
        --text: #ece6da;
        --muted: #93a1b3;

        --ok: #4fc0a8;
        --ok-bg: rgba(49, 145, 127, 0.16);
        --bad: #f07a6c;
        --bad-bg: rgba(240, 122, 108, 0.13);
        --warn: #e6b45a;
        --warn-bg: rgba(230, 180, 90, 0.13);
        --na: #9aa6b6;
        --na-bg: rgba(154, 166, 182, 0.12);

        --notice-bg: rgba(210, 185, 138, 0.08);
        --notice-border: rgba(210, 185, 138, 0.3);
        --notice-text: #e3cfa6;

        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.25);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
      }

      :focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 2px;
        border-radius: 10px;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.78rem;
        direction: ltr;
        unicode-bidi: isolate;
      }

      .muted {
        color: var(--muted);
      }

      [dir="rtl"] .dir-icon {
        transform: scaleX(-1);
      }

      .container {
        max-width: 1080px;
        margin-inline: auto;
        padding-inline: 20px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      /* ---------- Buttons ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 48px;
        padding-inline: 22px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        transition:
          background 0.15s,
          border-color 0.15s,
          transform 0.1s;
      }

      .btn:active:not(:disabled) {
        transform: scale(0.98);
      }

      .btn.sm {
        height: 38px;
        padding-inline: 14px;
        font-size: 0.85rem;
      }

      .btn-block {
        width: 100%;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--on-primary);
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--primary-700);
      }

      .btn-primary:disabled {
        background: var(--border-strong);
        color: var(--muted);
      }

      .btn-light {
        background: var(--gold);
        color: var(--navy);
      }

      .btn-light:hover {
        background: #e3cfa6;
      }

      .btn-outline {
        background: var(--card);
        border: 1.5px solid var(--border);
        color: var(--primary-700);
      }

      .btn-outline:hover {
        border-color: var(--primary);
      }

      .link-btn {
        color: var(--primary);
        font-weight: 600;
        font-size: 0.9rem;
      }

      .link-btn:hover {
        text-decoration: underline;
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        color: var(--muted);
      }

      .icon-btn:hover {
        background: var(--primary-50);
        color: var(--primary);
      }

      .lang-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 38px;
        padding-inline: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--primary-700);
      }

      .lang-btn.on-dark {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.28);
        color: #fff;
      }

      /* ---------- Login ---------- */
      .login {
        min-height: 100vh;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 64px 20px 40px;
        background: linear-gradient(
          180deg,
          #021122 0%,
          #021122 40%,
          #0b2440 100%
        );
      }

      .login-lang {
        position: absolute;
        top: 20px;
        inset-inline-end: 20px;
      }

      .login-hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
        color: #fff;
        margin-bottom: 28px;
      }

      .login-hero h1 {
        font-size: 2.3rem;
        line-height: 1.2;
      }

      .login-hero p {
        max-width: 340px;
        opacity: 0.85;
      }

      .login-card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border-radius: 22px;
        padding: 28px 24px;
        border: 1px solid var(--border);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .login-card h2 {
        font-size: 1.3rem;
      }

      .login-card > .link-btn {
        align-self: flex-start;
      }

      .login-register {
        text-align: center;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .field input {
        height: 50px;
        padding-inline: 14px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        background: var(--input);
        color: var(--text);
        font: inherit;
        font-weight: 400;
      }

      [dir="rtl"] .field input[dir="ltr"] {
        text-align: right;
      }

      .field input:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--card);
        box-shadow: 0 0 0 4px var(--primary-50);
      }

      .field input[aria-invalid="true"] {
        border-color: var(--bad);
      }

      .field-error {
        color: var(--bad);
        font-size: 0.85rem;
      }

      .secure-note {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 0.8rem;
        color: var(--muted);
        text-align: center;
      }

      .secure-note svg {
        flex-shrink: 0;
        color: var(--primary);
      }

      /* ---------- Top bar ---------- */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--card);
        border-bottom: 1px solid var(--border);
      }

      .topbar-inner {
        display: flex;
        align-items: center;
        gap: 24px;
        height: 68px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: start;
      }

      .brand strong {
        display: block;
        font-size: 1.2rem;
        line-height: 1.2;
        color: var(--text);
        letter-spacing: 0.02em;
      }

      .brand small {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
      }

      .topnav {
        display: flex;
        gap: 4px;
      }

      .topnav button {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding-inline: 14px;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--muted);
      }

      .topnav button:hover {
        background: var(--bg);
        color: var(--text);
      }

      .topnav button.active {
        background: var(--primary-50);
        color: var(--primary-700);
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-inline-start: auto;
      }

      /* ---------- Bottom nav (mobile) ---------- */
      .bottomnav {
        display: none;
      }

      .main {
        padding-block: 24px 56px;
      }

      .page {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .page.narrow {
        max-width: 640px;
        margin-inline: auto;
        width: 100%;
      }

      .page-title {
        font-size: 1.5rem;
        line-height: 1.3;
      }

      .page-title.sm {
        font-size: 1.15rem;
      }

      .page-sub {
        margin-top: 4px;
      }

      .back-btn {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--primary-700);
      }

      .section-title {
        font-size: 1.1rem;
      }

      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 32px;
      }

      /* ---------- Home ---------- */
      .hero-card {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 24px;
        align-items: center;
        padding: 28px;
        border-radius: 22px;
        color: #fff;
        background:
          radial-gradient(
            circle at 92% 8%,
            rgba(210, 185, 138, 0.2),
            transparent 38%
          ),
          linear-gradient(135deg, #021122, #0b2440);
        border: 1px solid rgba(210, 185, 138, 0.25);
      }

      .hero-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .hero-text h1 {
        font-size: 1.6rem;
        line-height: 1.3;
      }

      .hero-text p {
        max-width: 480px;
        opacity: 0.88;
      }

      .hero-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .hero-stats div {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 14px 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      .hero-stats strong {
        font-size: 1.6rem;
        line-height: 1.1;
      }

      .hero-stats span {
        font-size: 0.78rem;
        line-height: 1.35;
        opacity: 0.85;
      }

      .service-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
      }

      .service {
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: start;
        padding: 18px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        transition: border-color 0.15s;
      }

      .service:hover {
        border-color: var(--primary);
      }

      .service strong {
        font-size: 0.98rem;
      }

      .service-desc {
        font-size: 0.8rem;
        line-height: 1.5;
        color: var(--muted);
      }

      .service-icon {
        width: 46px;
        height: 46px;
        margin-bottom: 6px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: var(--primary-50);
        color: var(--primary);
      }

      .service.primary .service-icon {
        background: var(--navy);
        color: var(--gold);
      }

      /* ---------- Contract rows ---------- */
      .contract-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .contract-row {
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: start;
        padding: 14px 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .contract-row:hover {
        border-color: var(--primary);
      }

      .contract-icon {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--primary-50);
        color: var(--primary);
      }

      .contract-icon.lg {
        width: 54px;
        height: 54px;
        border-radius: 14px;
      }

      .contract-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .contract-info strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .contract-info .muted {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.82rem;
      }

      .mini-badges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding-inline: 10px;
        border-radius: 999px;
        font-size: 0.74rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .badge.ok {
        background: var(--ok-bg);
        color: var(--ok);
      }

      .badge.bad {
        background: var(--bad-bg);
        color: var(--bad);
      }

      .badge.warn {
        background: var(--warn-bg);
        color: var(--warn);
      }

      .badge.na {
        background: var(--na-bg);
        color: var(--na);
      }

      /* ---------- Upload ---------- */
      .dropzone {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        padding: 36px 20px;
        background: var(--card);
        cursor: pointer;
        border: 2px dashed var(--border-strong);
        border-radius: 20px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }

      .dropzone:hover,
      .dropzone.is-drag {
        border-color: var(--primary);
        background: var(--primary-50);
      }

      .dropzone.has-error {
        border-color: var(--bad);
      }

      .dropzone .btn {
        margin-top: 6px;
        pointer-events: none;
      }

      .drop-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 6px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--primary-50);
        color: var(--primary);
      }

      .file-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        background: var(--card);
        border: 1.5px solid var(--accent);
        border-radius: 14px;
      }

      .req-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 0.88rem;
        color: var(--muted);
      }

      .req-list li {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .req-list svg {
        flex-shrink: 0;
        color: var(--primary);
      }

      /* ---------- Analyzing ---------- */
      .analyzing {
        max-width: 480px;
        margin: 40px auto 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        text-align: center;
      }

      .spinner-ring {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--primary-50);
        color: var(--primary);
      }

      .spinner-ring::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: var(--primary);
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .progress {
        width: 100%;
        height: 8px;
        border-radius: 99px;
        background: var(--border);
        overflow: hidden;
      }

      .progress span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: var(--primary);
        transition: width 0.5s ease;
      }

      .steps {
        list-style: none;
        margin: 0;
        padding: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        text-align: start;
      }

      .steps li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--muted);
        font-weight: 500;
      }

      .steps li.active {
        border-color: var(--primary);
        color: var(--text);
      }

      .steps li.done {
        color: var(--text);
      }

      .step-mark {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 0.8rem;
        border: 2px solid var(--border);
      }

      .steps li.done .step-mark {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--on-primary);
      }

      .steps li.active .step-mark {
        border-color: var(--primary);
        border-top-color: transparent;
        animation: spin 0.8s linear infinite;
      }

      /* ---------- Results ---------- */
      .results-head {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        padding: 18px;
      }

      .results-file {
        font-size: 0.9rem;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 4px;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .meta span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .export {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      .summary-tile {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        text-align: start;
        padding: 16px;
        background: var(--card);
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        transition: border-color 0.15s;
      }

      .summary-tile strong {
        font-size: 1.9rem;
        line-height: 1.1;
        color: var(--c);
      }

      .tile-label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--muted);
      }

      .tile-icon {
        width: 36px;
        height: 36px;
        margin-bottom: 8px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: var(--cbg);
        color: var(--c);
      }

      .summary-tile.active {
        border-color: var(--c);
        box-shadow: 0 0 0 3px var(--cbg);
      }
      .contract-status-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .overall-summary {
        border: 1px solid var(--border);
        border-inline-start: 4px solid var(--c);
        border-radius: var(--radius);
        background: var(--card);
        overflow: hidden;
      }

      .overall-summary.ok {
        --c: var(--ok);
        background: var(--ok-bg);
      }

      .overall-summary.warn {
        --c: var(--warn);
        background: var(--warn-bg);
      }

      .overall-summary.bad {
        --c: var(--bad);
        background: var(--bad-bg);
      }

      .overall-summary-button {
        width: 100%;
        min-height: 58px;
        padding: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;

        transform: rotate(180deg);

      .overall-summary-content {
        padding: 14px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--card-2);
      }

      .contract-clause-item {
        padding: 14px;
        border: 1px solid var(--border);
        border-inline-start: 4px solid var(--c);
        border-radius: 12px;
        background: var(--card);
      }

      .contract-clause-item.ok {
        --c: var(--ok);
      }

      .contract-clause-item.warn {
        --c: var(--warn);
      }

      .contract-clause-item.bad {
        --c: var(--bad);
      }

      .contract-clause-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }

      .contract-clause-data {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .contract-clause-data > strong {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .contract-clause-data p {
        padding: 12px;
        background: var(--bg);
        border-radius: 10px;
        color: var(--text);
        font-size: 0.9rem;
        line-height: 1.7;
        overflow-wrap: anywhere;
        text-align: start;
      }

      @media (max-width: 820px) {
        .contract-status-grid {
          grid-template-columns: repeat(3, 1fr);
          gap: 8px;
        }

        .contract-status-grid .summary-tile {
          padding: 12px 8px;
        }

        .contract-status-grid .summary-tile strong {
          font-size: 1.4rem;
        }

        .contract-status-grid .tile-label {
          font-size: 0.72rem;
        }
      }

      /* Contract results */
      .contract-status-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .overall-summary {
        border: 1px solid var(--border);
        border-inline-start: 4px solid var(--c);
        border-radius: var(--radius);
        background: var(--card);
        overflow: hidden;
      }

      .overall-summary.ok {
        --c: var(--ok);
        background: var(--ok-bg);
      }

      .overall-summary.warn {
        --c: var(--warn);
        background: var(--warn-bg);
      }

      .overall-summary.bad {
        --c: var(--bad);
        background: var(--bad-bg);
      }

      .overall-summary-button {
        width: 100%;
        min-height: 58px;
        padding: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        text-align: start;
        color: var(--c);
        cursor: pointer;
        font-size: 0.95rem;
      }

      .overall-summary-arrow {
        font-size: 1.4rem;
        transition: transform 0.2s;
      }

      .overall-summary-arrow.open {
        transform: rotate(180deg);
      }

      .overall-summary-content {
        padding: 14px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: var(--card-2);
      }

      .contract-clause-item {
        padding: 14px;
        border: 1px solid var(--border);
        border-inline-start: 4px solid var(--c);
        border-radius: 12px;
        background: var(--card);
      }

      .contract-clause-item.ok {

      .contract-clause-item.warn {
        --c: var(--warn);
      }

      .contract-clause-item.bad {
        --c: var(--bad);
      }

      .contract-clause-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }

      .contract-clause-data {
        display: flex;
        flex-direction: column;
        gap: 8px;

      .contract-clause-data > strong {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .contract-clause-data p {
        padding: 12px;
        background: var(--bg);
        border-radius: 10px;
        color: var(--text);

      @media (max-width: 820px) {

      .ok {
        --c: var(--ok);
        --cbg: var(--ok-bg);
      }

      .bad {
        --c: var(--bad);
        --cbg: var(--bad-bg);
      }

      .warn {
        --c: var(--warn);
        --cbg: var(--warn-bg);
      }

      .na {
        --c: var(--na);
        --cbg: var(--na-bg);
      }

      .notice {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--notice-bg);
        border: 1px solid var(--notice-border);
        color: var(--notice-text);
        font-size: 0.86rem;
      }

      .notice svg {
        flex-shrink: 0;
        margin-top: 3px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip {
        height: 34px;
        padding-inline: 14px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--border);
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--muted);
      }

      .chip.active {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--on-primary);
      }

      .findings {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .finding {
        overflow: hidden;
        background: var(--card);
        border: 1px solid var(--border);
        border-inline-start: 4px solid var(--c);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .finding-head {
        width: 100%;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 16px;
        text-align: start;
      }

      .finding-icon {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: var(--cbg);
        color: var(--c);
      }

      .finding-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .finding-title {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .finding-expl {
        font-size: 0.88rem;
        color: var(--muted);
      }

      .chev {
        flex-shrink: 0;
        margin-top: 10px;
        color: var(--muted);
        transition: transform 0.2s;
      }

      .chev.open {
        transform: rotate(180deg);
      }

      /* The traceability chain: clause -> fact -> rule -> source */
      .chain {
        padding: 16px 20px 18px;
        border-top: 1px solid var(--border);
        background: var(--card-2);
      }

      .chain-step {
        position: relative;
        display: flex;
        gap: 14px;
        padding-bottom: 18px;
      }

      .chain-step::before {
        content: "";
        position: absolute;
        top: 18px;
        bottom: 0;
        inset-inline-start: 6px;
        width: 2px;
        background: var(--border);
      }

      .chain-step.last {
        padding-bottom: 0;
      }

      .chain-step.last::before {
        display: none;
      }

      .chain-dot {
        position: relative;
        z-index: 1;
        flex-shrink: 0;
        width: 14px;
        height: 14px;
        margin-top: 4px;
        border-radius: 50%;
        background: var(--card);
        border: 3px solid var(--c);
      }

      .chain-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .chain-label {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--muted);
      }

      .chain-label code {
        padding: 2px 8px;
        border-radius: 6px;
        background: var(--primary-50);
        color: var(--primary-700);
        white-space: pre;
      }

      .chain blockquote {
        margin: 0;
        padding: 10px 14px;
        font-size: 0.92rem;
        background: var(--bg);
        border-radius: 10px;
        border-inline-start: 3px solid var(--gold);
      }

      .chain p {
        font-size: 0.92rem;
      }

      .fact {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        border-radius: 10px;
        background: var(--cbg);
        font-size: 0.92rem;
      }

      .confidence {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.78rem;
        color: var(--muted);
      }

      .confidence .bar {
        flex: 1;
        max-width: 160px;
        height: 6px;
        border-radius: 99px;
        background: var(--border);
        overflow: hidden;
      }

      .confidence .bar span {
        display: block;
        height: 100%;
        background: var(--ok);
      }

      .confidence.low .bar span {
        background: var(--warn);
      }

      .confidence.low strong {
        color: var(--warn);
      }

      .source {
        font-weight: 600;
        color: var(--primary-700);
      }

      /* ---------- Rules ---------- */
      .search {
        position: relative;
        display: block;
      }

      .search svg {
        position: absolute;
        top: 50%;
        inset-inline-start: 14px;
        transform: translateY(-50%);
        color: var(--muted);
      }

      .search input {
        width: 100%;
        height: 48px;
        padding-inline: 44px 14px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        font: inherit;
        color: var(--text);
      }

      .search input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--primary-50);
      }

      .rule-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .rule-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 16px;
      }

      .rule-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .rule-top code {
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--primary-50);
        color: var(--primary-700);
      }

      .rule-card p {
        font-size: 0.86rem;
      }

      .rule-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: auto;
      }

      .rule-meta span {
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--bg);
        font-size: 0.75rem;
        color: var(--muted);
      }

      /* ---------- Profile ---------- */
      .profile-card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px;
      }

      .avatar {
        width: 60px;
        height: 60px;
        flex-shrink: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--navy);
        color: var(--gold);
      }

      .settings {
        overflow: hidden;
      }

      .settings button {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 18px;
        text-align: start;
        font-weight: 500;
        border-bottom: 1px solid var(--border);
      }

      .settings button:last-child {
        border-bottom: 0;
      }

      .settings button:hover {
        background: var(--bg);
      }

      .settings button > svg:first-child {
        color: var(--primary);
      }

      .settings .value {
        margin-inline-start: auto;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .settings .push {
        margin-inline-start: auto;
      }

      .settings .danger,
      .settings .danger svg:first-child {
        color: var(--bad);
      }

      /* ---------- Toast ---------- */
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        z-index: 50;
        transform: translateX(-50%);
        padding: 12px 20px;
        border-radius: 12px;
        max-width: calc(100% - 40px);
        background: var(--navy);
        color: #fff;
        font-size: 0.9rem;
        border: 1px solid rgba(210, 185, 138, 0.35);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        animation: toastIn 0.25s ease;
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translate(-50%, 10px);
        }
      }

      /* ---------- Responsive ---------- */
      @media (max-width: 820px) {
        .topnav {
          display: none;
        }

        .brand small {
          display: none;
        }

        .bottomnav {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          position: fixed;
          bottom: 0;
          inset-inline: 0;
          z-index: 20;
          padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
          background: var(--card);
          border-top: 1px solid var(--border);
        }

        .bottomnav button {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 2px;
          padding: 6px 0;
          border-radius: 12px;
          font-size: 0.72rem;
          font-weight: 600;
          color: var(--muted);
        }

        .bottomnav button.active {
          color: var(--primary);
        }

        .main {
          padding-bottom: 100px;
        }

        .toast {
          bottom: 90px;
        }

        .hero-card {
          grid-template-columns: 1fr;
          padding: 22px;
        }

        .service-grid,
        .summary-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .rule-grid {
          grid-template-columns: 1fr;
        }

        .mini-badges {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .container {
          padding-inline: 14px;
        }

        .lang-btn {
          padding-inline: 10px;
        }

        .hero-stats strong {
          font-size: 1.35rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition: none !important;
        }
      }

      /* ---------- Page preview bar (demo only) ---------- */
      .demobar {

        color: #fff;

      }

      .demobar-label {
        flex-shrink: 0;

        color: var(--gold);

      .demobar-list {

        padding-bottom: 2px;
      }

      .demobar-list button {
        flex-shrink: 0;
        height: 30px;
        padding-inline: 12px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      .demobar-list button:hover {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.4);
      }

      .demobar-list button.active {
        background: var(--gold);
        border-color: var(--gold);
        color: var(--navy);
      }

      .app .topbar {
        top: 46px;
      }

      .login .login-lang {
        top: 66px;
      }

      /* ---------- Register ---------- */
      .login-card.wide {
        max-width: 560px;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }

      .check {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 0.86rem;
        color: var(--muted);
      }

      .check input {
        width: 18px;
        height: 18px;
        margin-top: 3px;
        accent-color: var(--primary);
        flex-shrink: 0;
      }

      /* ---------- Confirm facts ---------- */
      .fact-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .fact-row {
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .fact-row.low {
        border-color: var(--warn);
        box-shadow: 0 0 0 3px var(--warn-bg);
      }

      .fact-row-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .fact-topic {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .fact-value {
        font-size: 1.1rem;
      }

      .fact-src {
        font-size: 0.85rem;
        color: var(--muted);
      }

      .fact-src span {
        font-weight: 600;
        color: var(--text);
      }

      .fact-row-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .fact-actions {
        display: flex;
        gap: 8px;
      }

      .fact-row .confidence {
        flex: 1;
      }

      /* ---------- Results confirm banner ---------- */
      .confirm-banner {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        padding: 14px 16px;
        border-radius: var(--radius);
        background: var(--card);
        border: 1.5px solid var(--warn);
        box-shadow: 0 0 0 3px var(--warn-bg);
      }

      .confirm-banner > div {
        flex: 1;
        min-width: 200px;
      }

      .confirm-banner p {
        font-size: 0.86rem;
      }

      /* ---------- Report sheet ---------- */
      .sheet-wrap {
        background: var(--card-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px 16px;
      }

      .sheet {
        max-width: 820px;
        margin-inline: auto;
        background: #fff;
        padding: 40px 44px;
        color: #0b1a2b;
        box-shadow: 0 8px 30px rgba(2, 17, 34, 0.18);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .sheet-head {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding-bottom: 18px;
        border-bottom: 3px solid var(--gold);
      }

      .sheet-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .sheet-brand strong {
        display: block;
        font-size: 1.1rem;
        color: var(--primary-900);
      }

      .sheet-brand span {
        font-size: 0.78rem;
        color: var(--muted);
      }

      .sheet-head h1 {
        font-size: 1.45rem;
      }

      .sheet h2 {
        font-size: 1rem;
        color: var(--primary-700);
      }

      .sheet-meta {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px 24px;
        margin: 0;
      }

      .sheet-meta div {
        display: flex;
        flex-direction: column;
      }

      .sheet-meta dt {
        font-size: 0.75rem;
        color: var(--muted);
      }

      .sheet-meta dd {
        margin: 0;
        font-weight: 600;
        font-size: 0.9rem;
      }

      .sheet-summary {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }

      .sheet-summary div {
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--cbg);
        display: flex;
        flex-direction: column;
      }

      .sheet-summary strong {
        font-size: 1.4rem;
        color: var(--c);
        line-height: 1.2;
      }

      .sheet-summary span {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--c);
      }

      .table-scroll {
        overflow-x: auto;
      }

      .sheet-table,
      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.84rem;
      }

      .sheet-table th,
      .data-table th {
        text-align: start;
        padding: 10px;
        font-size: 0.76rem;
        color: var(--muted);
        font-weight: 700;
        background: var(--bg);
        white-space: nowrap;
      }

      .sheet-table td,
      .data-table td {
        padding: 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }

      .sheet-table code,
      .data-table code {
        color: var(--primary-700);
      }

      .sheet-foot {
        margin-top: 8px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
        font-size: 0.78rem;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .sheet-foot div {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      /* ---------- Admin ---------- */
      .admin-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        background: var(--navy);
        color: var(--gold);
      }

      .summary-tile.static {
        cursor: default;
      }

      .small-stat {
        font-size: 1.15rem !important;
        padding-block: 6px;
      }

      .admin-grid {
        display: grid;
        grid-template-columns: 1.6fr 1fr;
        gap: 16px;
        align-items: start;
      }

      .table-card {
        overflow: hidden;
      }

      .data-table tr.selected td {
        background: var(--primary-50);
      }

      .nowrap {
        white-space: nowrap;
